# The TeX side, which ci.yml leaves out: build dist/tex as PLAN.md's Building section does (about
# 3 GB of downloads, every one checked by hash, from GitHub and Ubuntu's archive, which the machine
# Rikuy is developed on cannot reach), check it byte for byte against dev/dist-manifest.txt, then
# run the tests that compile with TeX in the page: test/engines.py, test/pdf.py and the offline
# compile of test/offline.py. The built
# dist/ is kept as a workflow artifact for a week: deploy.yml publishes it to Cloudflare Pages once
# this run has passed. Runs on every push to main (dist/tex comes from a cache when the tree's
# inputs are unchanged, so the tree is built once per set of inputs, never twice per push), on
# pull requests that touch the TeX side, and by hand.
name: TeX
on:
  # every push to main: deploy.yml deploys the dist/ this run keeps, so a change to the page alone
  # needs a run too; the tree itself is built only when its inputs changed (the cache below)
  push:
    branches: [main]
  pull_request:
    paths:
      - 'tex/**'
      - 'inputs/**'
      - 'build.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'src/pdfview.js'
      - 'src/tex.js'
      - 'src/sw.js'
      - 'src/pwa.js'
      - 'build/app.mjs'
      - 'test/offline.py'
      - 'test/pages.py'
      - 'dev/dist-manifest.txt'
      - 'test/engines.py'
      - 'test/pdf.py'
      - 'src/ribbon.js'
      - 'test/ribbon.py'
      - 'test/agent.py'
      - 'test/font.py'
      - 'src/cmd/font.js'
      - 'src/charfmt.js'
      - 'test/preamble.py'
      - 'test/find.py'
      - 'test/outline.py'
      - 'test/serve.py'
      - 'test/browser.py'
      - '.github/workflows/tex.yml'
  workflow_dispatch:
permissions:
  contents: read
# one run per branch: a newer push replaces the run of an older one, so an old commit's run cannot
# finish last and be deployed over a newer one
concurrency:
  group: tex-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tex:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      RIKUY_WORK: /mnt/eng
      # Azure's copy of Ubuntu's archive, next to the runner; same paths, same hashes
      UBUNTU_MIRROR: http://azure.archive.ubuntu.com/ubuntu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      # a Python of its own: pip does not install into Ubuntu 24.04's system Python
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      # dist/tex built by an earlier run from the same inputs: the tree is a function of tex/,
      # inputs/ and the npm packages (Pyodide's wheels), and the manifest check below holds it
      - name: The TeX tree of an earlier run with the same inputs
        id: tree
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: dist/tex
          key: dist-tex-${{ hashFiles('tex/**', 'inputs/**', 'package-lock.json', 'dev/dist-manifest.txt') }}
      - name: Tools
        run: |
          npm ci --omit=dev
          python3 -m pip install lz4==4.4.4 playwright==1.56.0 pypdf==5.9.0 numpy==2.3.4
          python3 -m playwright install --with-deps chromium
          # the work folder holds about 10 GB; the runner's second disk has room
          sudo mkdir -p /mnt/eng && sudo chown "$USER" /mnt/eng
          df -h / /mnt
      - name: Build inputs
        if: steps.tree.outputs.cache-hit != 'true'
        run: sh tex/fetch_inputs.sh
      - name: Build the tree and its packs
        if: steps.tree.outputs.cache-hit != 'true'
        run: python3 tex/build_tree.py tree && python3 tex/build_tree.py packs
      - name: Build the page
        run: node build.mjs && du -sh dist dist/tex
      - name: dist/tex as dev/dist-manifest.txt lists it
        run: cd dist/tex && find . -type f | sort | xargs sha256sum | diff ../../dev/dist-manifest.txt -
      # every test must pass; a test that cannot run here is left out, never run with `|| true`
      - name: Engines and shell escape in the page
        run: npm run test:engines
      - name: pdfLaTeX in the PDF pane, under the host's policy
        run: cd test && python3 pdf.py
      - name: The installed app, Make available offline, then a compile with no network
        run: cd test && python3 offline.py
      - name: The ribbon, with Download PDF compiling and saving the file
        run: cd test && python3 ribbon.py
      - name: Rikuy as an agent meets it, with rikuy.api.compile making a real PDF
        run: cd test && python3 agent.py
      - name: The preamble's format gives the pass an ordinary compile gives
        run: cd test && python3 preamble.py
      - name: Find and Replace, then the PDF has the text replaced
        run: cd test && python3 find.py
      - name: The outline, then the PDF has the heading at the level it was given
        run: cd test && python3 outline.py
      - name: Every format of the Font group compiles in the page
        run: cd test && python3 font.py compiles
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rikuy-dist
          path: dist
          # (main's run is what Deploy takes, and what an agent fetches for a TeX tree: a week; a
          # pull request's only shows its checks passed, and each one is 330 MB of the account's
          # artifact storage, which ran full on 2026-11-12)
          retention-days: ${{ github.ref == 'refs/heads/main' && 7 || 1 }}
          # the packs are compressed already
          compression-level: 0
