# One or more browser suites, run a set number of times on a GitHub runner, for work on the suites
# themselves: an agent changing a suite dispatches this on its branch (and on main for the "before")
# instead of loading the two cores of its own machine, and reads each run's time and check count in
# the job's summary. It gates nothing; the pull request's own CI is what must pass.
name: Suites
on:
  workflow_dispatch:
    inputs:
      suites:
        description: 'Suites to run, space separated; a suite with parts as file:part1,part2 (e.g. "tabs.py eqtab.py ux.py:first_visit,file_view")'
        required: true
      repeat:
        description: Runs of each suite (every run must pass)
        default: '3'
      tex:
        description: Restore dist/tex from main's TeX tree cache (for suites that compile)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: suites-${{ github.ref }}-${{ inputs.suites }}
  cancel-in-progress: true
jobs:
  suites:
    name: ${{ inputs.suites }} ×${{ inputs.repeat }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: The TeX tree main's TeX run saved
        if: inputs.tex
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: dist/tex
          key: dist-tex-${{ hashFiles('tex/**', 'inputs/**', 'package-lock.json', 'dev/dist-manifest.txt') }}
          fail-on-cache-miss: true
      - run: npm ci --omit=dev
      - run: npm run build
      - name: Playwright and Chromium
        uses: ./.github/actions/playwright
        with:
          playwright: '1.56.0'
          packages: pypdf==5.9.0 python-docx==1.2.0 lz4==4.4.4 numpy==2.3.4
      - name: Tools
        if: inputs.tex
        run: sudo apt-get install -y --no-install-recommends poppler-utils
      - name: The suites
        env:
          SUITES: ${{ inputs.suites }}
          REPEAT: ${{ inputs.repeat }}
        # (split on spaces into an array: no globbing, as shellcheck asks)
        run: read -ra S <<< "$SUITES" && python3 dev/suite_runs.py "$REPEAT" "${S[@]}"
