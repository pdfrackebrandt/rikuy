# PLAN task 3: the arXiv corpus, run where arXiv is reachable (the machine Rikuy is developed
# on cannot reach it). Started by hand (Actions, "arXiv corpus", Run workflow); it takes about
# 20 runner hours in all (free on a public repository, Actions minutes on a private one).
#   sources   choose the sample (dev/arxiv_corpus.py, seeded) unless dev/arxiv-ids.txt exists,
#             download the papers at one request per 3 s, keep them in the Actions cache
#   rikuy     build dist/ as PLAN.md's Building section does
#   shard     8 jobs, each compiling an eighth of the papers with Rikuy (corpus_full.py) and
#             with a desktop TeX Live 2026 (pdfcompare.py), both inside dev/sandbox.sh
#   collect   commit the identifiers, the compile results and the comparison to the branch
#             arxiv-results; the sources are never committed
name: arXiv corpus
on:
  workflow_dispatch:
# Read only, except the job that commits: the shards compile papers from arXiv with a desktop
# TeX Live and shell escape, which runs whatever a paper asks for, so no job that compiles holds
# a token that can push, and their checkouts keep no credentials. The runner user could still
# read the token for the Actions cache from the runner's memory (it has passwordless sudo) and
# plant a cache entry a trusted workflow restores later, so the compiles run as another user,
# with no way to sudo and only their own folders writable (dev/sandbox.sh). Python packages are
# pinned by hash (dev/arxiv-requirements.txt).
permissions:
  contents: read
env:
  SHARDS: 8
  SDE: '1700000000'
jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Sample and fetch
        run: |
          [ -f dev/arxiv-ids.txt ] || python3 dev/arxiv_corpus.py sample dev/arxiv-ids.txt
          python3 dev/arxiv_corpus.py fetch dev/arxiv-ids.txt "$HOME/arxiv"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/arxiv
          key: arxiv-src-${{ github.run_id }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arxiv-ids
          path: dev/arxiv-ids.txt
  rikuy:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Build dist/
        run: |
          npm ci
          python3 -m venv "$RUNNER_TEMP/py" && . "$RUNNER_TEMP/py/bin/activate"
          pip install --require-hashes --only-binary :all: -r dev/arxiv-requirements.txt
          sudo mkdir -p /mnt/eng && sudo chown "$USER" /mnt/eng
          export RIKUY_WORK=/mnt/eng
          sh tex/fetch_inputs.sh
          python3 tex/build_tree.py tree && python3 tex/build_tree.py packs && node build.mjs
          du -sh dist
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: dist
          key: rikuy-dist-${{ github.run_id }}
  shard:
    needs: [sources, rikuy]
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      TL26: /mnt/tl26
    strategy:
      fail-fast: false
      matrix:
        k: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: arxiv-ids
          path: dev
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/arxiv
          key: arxiv-src-${{ github.run_id }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: dist
          key: rikuy-dist-${{ github.run_id }}
          fail-on-cache-miss: true
      # What the sandbox sees: /mnt/corpus/py (Python), pw (Chromium), rikuy (dev/, test/,
      # tex/tex-smoke.html, dist/), arxiv (the sources) and /mnt/tl26, read only; it writes only
      # /mnt/corpus/home, out (the results) and /mnt/tl26/home (TEXMFVAR, font caches).
      - name: Chromium, poppler and the desktop TeX Live 2026
        env:
          PLAYWRIGHT_BROWSERS_PATH: /mnt/corpus/pw
        run: |
          sudo mkdir -p /mnt/corpus /mnt/eng /mnt/tl26 && sudo chown "$USER" /mnt/corpus /mnt/eng /mnt/tl26
          python3 -m venv /mnt/corpus/py
          /mnt/corpus/py/bin/pip install --require-hashes --only-binary :all: -r dev/arxiv-requirements.txt
          /mnt/corpus/py/bin/python -m playwright install --with-deps chromium
          sudo apt-get install -y poppler-utils xvfb
          # the packages' folder and the TeX Live made of hard links to it share one file system
          RIKUY_WORK=/mnt/eng UBUNTU_MIRROR=http://azure.archive.ubuntu.com/ubuntu sh dev/fetch_tl26.sh
      - name: The sandbox, and a check that it holds
        run: |
          mkdir -p /mnt/corpus/rikuy/tex
          cp -r dev test dist /mnt/corpus/rikuy/ && cp tex/tex-smoke.html /mnt/corpus/rikuy/tex/
          mv "$HOME/arxiv" /mnt/corpus/arxiv
          chmod -R a+rX /mnt/corpus
          sudo useradd --no-create-home --home-dir /mnt/corpus/home --shell /usr/sbin/nologin --user-group corpus
          sudo install -d -o corpus -g corpus -m 700 /mnt/corpus/home
          sudo install -d -o corpus -g corpus -m 755 /mnt/corpus/out
          sudo chown -R corpus:corpus /mnt/tl26/home
          sudo sh dev/sandbox.sh corpus -w /mnt/corpus/home -w /mnt/corpus/out -w /mnt/tl26/home \
            PATH=/usr/bin:/bin HOME=/mnt/corpus/home \
            python3 -I /mnt/corpus/rikuy/dev/sandbox_check.py /mnt/corpus/home /mnt/corpus/out /mnt/tl26/home
      # the two steps that run what the papers ask for; nothing they leave running outlives them
      - name: Compile with Rikuy
        run: |
          sudo sh dev/sandbox.sh corpus -w /mnt/corpus/home -w /mnt/corpus/out -w /mnt/tl26/home \
            PATH=/mnt/corpus/py/bin:/usr/bin:/bin HOME=/mnt/corpus/home LANG=C.UTF-8 \
            PLAYWRIGHT_BROWSERS_PATH=/mnt/corpus/pw SDE="$SDE" SHARD="${{ matrix.k }}/$SHARDS" \
            CORPUS_LIST=/mnt/corpus/rikuy/dev/arxiv-ids.txt CORPUS_REPO=/mnt/corpus/arxiv RIKUY_DIST=/mnt/corpus/rikuy/dist PDF_DIR=/mnt/corpus/out/pdf \
            python3 /mnt/corpus/rikuy/dev/corpus_full.py "/mnt/corpus/out/arxiv-results-${{ matrix.k }}.jsonl"
      - name: Compare with the desktop TeX Live
        run: |
          sudo sh dev/sandbox.sh corpus -w /mnt/corpus/home -w /mnt/corpus/out -w /mnt/tl26/home \
            PATH=/mnt/corpus/py/bin:/usr/bin:/bin HOME=/mnt/corpus/home LANG=C.UTF-8 \
            TL26=/mnt/tl26 SDE="$SDE" CORPUS_LIST=/mnt/corpus/rikuy/dev/arxiv-ids.txt CORPUS_REPO=/mnt/corpus/arxiv \
            python3 /mnt/corpus/rikuy/dev/pdfcompare.py "/mnt/corpus/out/arxiv-results-${{ matrix.k }}.jsonl" /mnt/corpus/out/pdf \
              "/mnt/corpus/out/arxiv-pdfcompare-${{ matrix.k }}.jsonl"
      # the results are the papers' output: only regular files are taken, never a link they made
      - name: Take the results out
        if: always()
        run: |
          for f in /mnt/corpus/out/arxiv-results-${{ matrix.k }}.jsonl /mnt/corpus/out/arxiv-pdfcompare-${{ matrix.k }}.jsonl; do
            if [ -f "$f" ] && [ ! -L "$f" ]; then cp -- "$f" .; fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: arxiv-shard-${{ matrix.k }}
          path: arxiv-*-${{ matrix.k }}.jsonl
  collect:
    needs: shard
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: shards
      - name: Merge and commit to arxiv-results
        run: |
          cp shards/arxiv-ids/arxiv-ids.txt dev/arxiv-ids.txt
          python3 - <<'PY'
          import glob, json
          ids = [l.split()[0] for l in open('dev/arxiv-ids.txt') if l.strip() and not l.startswith('#')]
          order = {i: n for n, i in enumerate(ids)}
          for kind in ('results', 'pdfcompare'):
              rows = [json.loads(l) for f in glob.glob('shards/arxiv-shard-*/arxiv-%s-*.jsonl' % kind) for l in open(f)]
              rows.sort(key=lambda r: order.get(r['doc'].split('/')[1], 1 << 30))
              with open('dev/arxiv-%s.jsonl' % kind, 'w') as out:
                  for r in rows:
                      out.write(json.dumps(r) + '\n')
              print(kind, len(rows))
          PY
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -b arxiv-results
          git add dev/arxiv-ids.txt dev/arxiv-results.jsonl dev/arxiv-pdfcompare.jsonl
          git commit -m "arXiv corpus: identifiers, Rikuy's results and the comparison with TeX Live 2026 (run ${{ github.run_id }})"
          git push -f origin arxiv-results
