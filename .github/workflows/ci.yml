name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # every test must pass; a test that cannot run here is left out, never run with `|| true`
      - name: Editor model
        run: |
          node test/model.test.mjs
          node test/edge.test.mjs
          node test/fences.test.mjs
          node test/minimal.test.mjs
      - name: Editor model on the LaTeX-examples corpus
        run: |
          git clone -q https://github.com/MartinThoma/LaTeX-examples.git "$RUNNER_TEMP/le"
          git -C "$RUNNER_TEMP/le" checkout -q 8bfd313b8d98b5e46c27eb23e082d0455fe692d3
          node test/corpus.test.mjs "$RUNNER_TEMP/le"
      - name: xindy against TeX Live's
        run: node --no-experimental-fetch tex/native/xindy/test.cjs
