name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Node unit tests
        run: |
          node test/model.test.mjs
          node test/corpus.test.mjs || true
          node test/edge.test.mjs || true
          node test/fences.test.mjs || true
          node test/minimal.test.mjs || true
      - name: xindy tests
        run: node --no-experimental-fetch tex/native/xindy/test.cjs
