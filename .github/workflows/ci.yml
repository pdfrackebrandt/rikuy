name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      # without the dev dependencies: wrangler (and its 100 MB runtime) is only for deploy.yml
      - run: npm ci --omit=dev
      # every test must pass; a test that cannot run here is left out, never run with `|| true`
      - name: Unit tests (editor model, minimal patch, siunitx, xindy against TeX Live's, Pages' limits)
        run: npm test
      - name: Editor model on the LaTeX-examples corpus
        run: |
          git clone -q https://github.com/MartinThoma/LaTeX-examples.git "$RUNNER_TEMP/le"
          git -C "$RUNNER_TEMP/le" checkout -q 8bfd313b8d98b5e46c27eb23e082d0455fe692d3
          npm run test:corpus -- "$RUNNER_TEMP/le"
  # The editor in Chromium. These tests need only the page (npm run build), not the TeX tree's
  # packs; pdf.py and engines.py compile with TeX and need them, and stress.py holds keystroke
  # times to limits a shared runner may miss, so those three are left out.
  editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      # a Python of its own: pip does not install into Ubuntu 24.04's system Python
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: npm ci --omit=dev
      - run: npm run build
      # deploy.yml's check on the hosted build, without dist/tex: it fits Cloudflare Pages
      - name: The hosted build within Cloudflare Pages' limits (a dry run of deploy.yml's check)
        run: python3 dev/pages_check.py dist
      # the versions the tests last passed with; pypdf lets frontier.py read its printed PDF back,
      # python-docx lets word.py write and edit Word files as Word users' tools do
      - name: Playwright and Chromium
        run: |
          python3 -m pip install playwright==1.56.0 pypdf==5.9.0 python-docx==1.2.0
          python3 -m playwright install --with-deps chromium
      # every test must pass; a test that cannot run here is left out, never run with `|| true`
      - name: Typing on the page
        run: npm run test:browser
      - name: Projects with several files
        run: cd test && python3 features.py
      - name: Whole projects saved byte for byte
        run: cd test && python3 files.py
      - name: Git, push and pull through git http-backend
        run: cd test && python3 git.py
      - name: Versions and track changes
        run: cd test && python3 history.py
      - name: Paste from Word, Google Docs, web pages and chat assistants
        run: cd test && python3 paste.py
      - name: The math field
        run: cd test && python3 mathfield.py
      - name: Word style math
        run: cd test && python3 wordmath.py
      - name: Equation extras
        run: cd test && python3 eqextras.py
      - name: Print, outline, problems and rich copy
        run: cd test && python3 frontier.py
      - name: Share links, comments, the copy back, Overleaf and .tex out
        run: cd test && python3 share.py
      - name: Live figures (rikuy.sty), under the host's policy
        run: cd test && python3 widgets.py
      # its Download PDF needs dist/tex and runs where that exists; here it says it skips that part
      - name: The ribbon (styles, lists, inserting, the three downloads)
        run: cd test && python3 ribbon.py
      - name: The ribbon's frame (tabs, contextual tabs, folding, keys, search, the right click menu, the kit)
        run: cd test && python3 tabs.py
      # its PDF checks (page size, header, line numbers, Print) need dist/tex and run in tex.yml
      - name: The page's set up (margins, size, breaks, columns, headers and footers, line numbers, background)
        run: cd test && python3 page.py
      - name: Rikuy as an agent meets it (the scripting surface, every control by its name)
        run: cd test && python3 agent.py
      # their PDF checks need dist/tex and run in tex.yml; here they say they skip that part
      - name: Find, Replace and Go To (the Navigation pane's search, the Find and Replace dialog, Select)
        run: cd test && python3 find.py
      - name: The outline (promote, demote, move; the Navigation pane's headings, pages and results; the Outline view)
        run: cd test && python3 outline.py
      # its compile offline needs dist/tex and runs in tex.yml; here it says it skips that part
      - name: The installed app offline, its updates, and none in the artifact build
        run: cd test && python3 offline.py
      - name: Opening .tex, .bib and .zip with the installed app, and sharing files to it
        run: cd test && python3 launch.py
      - name: Word, both ways, and a coauthor's edits back (LibreOffice's checks run where it is installed)
        run: cd test && python3 word.py
  # the workflows themselves: actionlint, run through Go's module proxy, which checks the module
  # against the checksum database (sum.golang.org), so the version is pinned by hash
  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
