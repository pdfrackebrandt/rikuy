name: CI
on:
  push:
    branches: [main]
  pull_request:
# A pull request's newer push cancels its older run (several agents push to their branches every
# few minutes and the free runners queue); main's runs are never cancelled, they deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      # without the dev dependencies: wrangler (and its 100 MB runtime) is only for deploy.yml
      - run: npm ci --omit=dev
      # every test must pass; a test that cannot run here is left out, never run with `|| true`
      - name: Unit tests (editor model, minimal patch, siunitx, xindy against TeX Live's, Pages' limits)
        run: npm test
      - name: Editor model on the LaTeX-examples corpus
        run: |
          git clone -q https://github.com/MartinThoma/LaTeX-examples.git "$RUNNER_TEMP/le"
          git -C "$RUNNER_TEMP/le" checkout -q 8bfd313b8d98b5e46c27eb23e082d0455fe692d3
          npm run test:corpus -- "$RUNNER_TEMP/le"
      # npm test runs its short streams; here the long ones, and every document of the corpus
      - name: Incremental model against the full build (long streams, the corpus)
        run: INCR_FULL=1 node test/incremental.test.mjs "$RUNNER_TEMP/le"
  # The editor in Chromium, in shards that run side by side. These tests need only the page (npm
  # run build), not the TeX tree's packs; pdf.py and engines.py compile with TeX and need them, and
  # stress.py holds keystroke times to limits a shared runner may miss, so those are left out
  # (.github/ci-shards.json says where every script of test/ runs). Which suite and part runs in
  # which shard is that list, dealt by dev/ci_balance.py from main's measured times; each shard
  # builds the page itself, runs its commands one after another (every one, even after a failure)
  # and leaves a record of what ran, how long and how it ended. Each shard's limit is 1.5 times its
  # measured p95: a shard over its budget fails, it is not waited for.
  editor-shard:
    name: editor shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix:
        # shards: written by dev/ci_balance.py from .github/ci-shards.json
        include:
          - {shard: 1, minutes: 18}
          - {shard: 2, minutes: 18}
          - {shard: 3, minutes: 18}
          - {shard: 4, minutes: 18}
          - {shard: 5, minutes: 18}
          - {shard: 6, minutes: 18}
          - {shard: 7, minutes: 18}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      # a Python of its own: pip does not install into Ubuntu 24.04's system Python
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: npm ci --omit=dev
      - run: npm run build
      # deploy.yml's check on the hosted build, without dist/tex: it fits Cloudflare Pages
      - name: The hosted build within Cloudflare Pages' limits (a dry run of deploy.yml's check)
        run: python3 dev/pages_check.py dist
      # the versions the tests last passed with; pypdf lets frontier.py read its printed PDF back,
      # python-docx lets word.py write and edit Word files as Word users' tools do
      - name: Playwright and Chromium
        uses: ./.github/actions/playwright
        with:
          playwright: '1.56.0'
          packages: pypdf==5.9.0 python-docx==1.2.0
      # every test must pass; a test that cannot run here is left out, never run with `|| true`
      - name: The shard's suites, as .github/ci-shards.json lists them
        run: python3 dev/ci_shards.py run "$SHARD" "$RUNNER_TEMP/ci-shard-$SHARD.json"
        env:
          SHARD: ${{ matrix.shard }}
      # the record goes up even when a suite failed, so the gate can say which; main's records
      # are what dev/ci_balance.py balances the shards from
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: ci-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/ci-shard-${{ matrix.shard }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 3 }}
  # The gate the ruleset requires: it passes only when every shard passed and the shards' records
  # together are .github/ci-shards.json's commands, each run and passed on this commit, and that
  # list still holds every suite of test/ and every part of a suite split by part.
  editor:
    needs: editor-shard
    # always(), not !cancelled(): a cancelled run must end this required gate red, never skipped
    # (GitHub counts a skipped job as passing a required check)
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ci-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/shards
      - name: Every shard passed, and together they ran every suite and part of the list
        run: python3 dev/ci_shards.py gate "$RUNNER_TEMP/shards"
        env:
          SHARDS_RESULT: ${{ needs.editor-shard.result }}
  # the workflows themselves: actionlint, run through Go's module proxy, which checks the module
  # against the checksum database (sum.golang.org), so the version is pinned by hash
  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      # every script of test/ in a shard of the editor or named with where it runs, every part of a
      # suite split by part in one shard, ci.yml's matrix as the list has it (the editor gate
      # checks it again, with the shards' records)
      - name: The editor's shards against test/ and ci.yml
        run: python3 dev/ci_shards.py check
