<!doctype html><meta charset=utf8><pre id=o></pre><script>
// Test page for the TeX worker alone (used by the corpus and engine tests, not shipped to users).
const w = new Worker('tex/engine.js');
window.events = [];
w.onmessage = ({ data }) => {
  window.events.push(data.status || (data.ready ? 'ready' : data.result ? 'result' : data.execResult ? 'exec' : 'error'));
  if (data.ready) window.ready = data;
  if (data.result) window.result = data.result;
  if (data.execResult) window.execResult = data.execResult;
  if (data.shellResult) window.shellResult = data.shellResult;
  if (data.error) window.err = data;
};
const Q = new URLSearchParams(location.search);
w.postMessage({ init: true, base: new URL('tex/', location.href).href, mirror: Q.get('texlive') || null,
  env: Q.get('sde') ? { SOURCE_DATE_EPOCH: Q.get('sde'), FORCE_SOURCE_DATE: '1' } : null });
window.compile = (files, main, clean, project, bibSig, engine, extra) => { window.result = null; window.err = null; w.postMessage({ compile: Object.assign({ id: 'x', project: project || ('p' + Math.random()), files, main, clean: !!clean, bibSig: bibSig || '', engine: engine || 'auto' }, extra || {}) }); };
window.exec = (job) => { window.execResult = null; window.err = null; w.postMessage({ exec: job }); };
window.shell = (job) => { window.shellResult = null; window.err = null; w.postMessage({ shell: job }); };
</script>
