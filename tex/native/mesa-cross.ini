# meson's cross file for Mesa in WebAssembly (build_tools.sh mesa)
[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
pkg-config = 'pkg-config'

[properties]
needs_exe_wrapper = true

[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'

[built-in options]
c_args = ['-D_GNU_SOURCE']
cpp_args = ['-D_GNU_SOURCE']
