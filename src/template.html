<title>Rikuy</title>
<style>/*FONTS*/</style>
<style>/*KATEX*/</style>
<style>/*CODEMIRROR*/</style>
<style>/*APP*/</style>
<div id="app">
  <header id="bar">
    <button id="b-nav" class="btn ghost icon" type="button" aria-pressed="false" title="Outline, problems and changes (Ctrl+Shift+O)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 5.5h13M6.5 10h10M6.5 14.5h10"/></svg><span class="sr">Outline and problems</span><span id="nav-dot" class="nav-dot" hidden></span></button>
    <div class="brand"><span class="mark">Rikuy</span><span id="docname" class="docname"></span></div>
    <div class="tools">
      <button id="b-open" class="btn ghost" type="button" title="Open .tex, .bib, images, an Overleaf .zip or a Word .docx (Ctrl+O)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5.5h5l1.5 1.5H17v8.5H3z"/></svg><span>Open</span></button>
      <button id="b-pdf" class="btn ghost" type="button" aria-pressed="false" title="Show the PDF as TeX makes it, beside the page (Ctrl+P)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 2.5h7l3.5 3.5v11.5H5zM12 2.5V6h3.5M7.5 10h5M7.5 13h5"/></svg><span>Preview</span></button>
      <button id="b-share" class="btn ghost" type="button" title="A link anyone can open and type in, or a copy for Overleaf"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="5" cy="10" r="2.2"/><circle cx="15" cy="5" r="2.2"/><circle cx="15" cy="15" r="2.2"/><path d="M7 9l6-3M7 11l6 3"/></svg><span>Share</span></button>
      <span class="sep"></span>
      <button id="b-undo" class="btn ghost icon" type="button" title="Undo (Ctrl+Z)" disabled><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5 3.5 8.5 7 12M4 8.5h8a4 4 0 0 1 0 8H9"/></svg><span class="sr">Undo</span></button>
      <button id="b-redo" class="btn ghost icon" type="button" title="Redo (Ctrl+Shift+Z)" disabled><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m13 5 3.5 3.5L13 12m3-3.5H8a4 4 0 0 0 0 8h3"/></svg><span class="sr">Redo</span></button>
      <span class="sep"></span>
      <div class="zoom" role="group" aria-label="Zoom">
        <button id="b-zout" class="btn ghost icon" type="button" title="Zoom out"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10"/></svg><span class="sr">Zoom out</span></button>
        <button id="zoomv" class="btn ghost zv" type="button" title="Fit width">Fit</button>
        <button id="b-zin" class="btn ghost icon" type="button" title="Zoom in"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10M10 5v10"/></svg><span class="sr">Zoom in</span></button>
      </div>
      <span class="sep"></span>
      <button id="b-ai" class="btn ghost ai-only" type="button" title="Ask Claude to rewrite the selection"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5v4M10 13.5v4M2.5 10h4M13.5 10h4M5 5l2.2 2.2M12.8 12.8 15 15M15 5l-2.2 2.2M7.2 12.8 5 15"/></svg><span>Ask Claude</span></button>
      <button id="b-src" class="btn ghost" type="button" aria-pressed="false" title="Show the source (Ctrl+\)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m7 6-4 4 4 4m6-8 4 4-4 4"/></svg><span>Source</span></button>
      <button id="b-help" class="btn ghost icon" type="button" title="How it works"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M8 8a2 2 0 1 1 2.8 1.8c-.5.3-.8.7-.8 1.2v.5M10 14v.2"/></svg><span class="sr">Help</span></button>
    </div>
  </header>
  <div id="ribbon" class="rb" role="toolbar" aria-label="Formatting, inserting and downloading">
    <select id="rb-style" class="rb-style" aria-label="Style of this paragraph" title="Style of the paragraph the caret is in">
      <option value="p">Normal text</option><option value="title">Title</option><option value="section">Heading 1</option><option value="subsection">Heading 2</option><option value="subsubsection">Heading 3</option>
    </select>
    <span class="sep"></span>
    <button id="rb-b" class="btn ghost icon" type="button" data-rb="textbf" aria-pressed="false" title="Bold (Ctrl+B)"><b>B</b><span class="sr">Bold</span></button>
    <button id="rb-i" class="btn ghost icon" type="button" data-rb="emph" aria-pressed="false" title="Italic (Ctrl+I)"><i>I</i><span class="sr">Italic</span></button>
    <button id="rb-u" class="btn ghost icon" type="button" data-rb="underline" aria-pressed="false" title="Underline (Ctrl+U)"><u>U</u><span class="sr">Underline</span></button>
    <span class="sep"></span>
    <button id="rb-ul" class="btn ghost icon" type="button" data-rb="itemize" aria-pressed="false" title="Bulleted list"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6h.01M4 10h.01M4 14h.01M8 6h8.5M8 10h8.5M8 14h8.5"/></svg><span class="sr">Bulleted list</span></button>
    <button id="rb-ol" class="btn ghost icon" type="button" data-rb="enumerate" aria-pressed="false" title="Numbered list"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.4 4.9l1-.6v3.2M3.2 9h1.2c.9 0 .9 1 .2 1.6L3.2 12h1.9M8 6h8.5M8 10h8.5M8 14h8.5"/></svg><span class="sr">Numbered list</span></button>
    <span class="sep"></span>
    <button id="rb-math" class="btn ghost" type="button" data-rb="math" title="Formula in the line ($ or Ctrl+M)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M14.5 6V4.5h-9l5 5.5-5 5.5h9V14"/></svg><span>Formula</span></button>
    <button id="rb-eq" class="btn ghost" type="button" data-rb="equation" title="Numbered equation on a line of its own (Ctrl+Shift+E)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7.5h8.5M3 12.5h8.5M14.5 5.5q-1.8 4.5 0 9M17 5.5q1.8 4.5 0 9"/></svg><span>Equation</span></button>
    <button id="rb-table" class="btn ghost" type="button" data-rb="table" title="Table, two by two to start with"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 4.5h13v11h-13zM3.5 8.5h13M10 4.5v11"/></svg><span>Table</span></button>
    <button id="rb-pic" class="btn ghost" type="button" data-rb="picture" title="Picture from a file (PNG, JPEG or PDF)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 4.5h13v11h-13zM3.5 13.5l3.5-3.5 3 3 2.5-2 4 3.5M13 7.8h.01"/></svg><span>Picture</span></button>
    <button id="rb-fn" class="btn ghost" type="button" data-rb="footnote" title="Footnote"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 8l6 7.5M10 8l-6 7.5M14 5.2l1.6-1v5.6"/></svg><span>Footnote</span></button>
    <button id="rb-cite" class="btn ghost" type="button" data-rb="cite" title="Citation of a work in the bibliography"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4.5H5v11h2M13 4.5h2v11h-2M9.4 8.2l1.2-.8v5.4"/></svg><span>Citation</span></button>
    <button id="rb-link" class="btn ghost" type="button" data-rb="url" title="Link: a web address written out"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8.6 11.4a3 3 0 0 0 4.2 0l2.2-2.2a3 3 0 0 0-4.2-4.2l-.9.9M11.4 8.6a3 3 0 0 0-4.2 0L5 10.8A3 3 0 0 0 9.2 15l.9-.9"/></svg><span>Link</span></button>
    <span class="grow"></span>
    <div class="rb-dl" role="group" aria-label="Download">
      <span class="rb-lab">Download</span>
      <button id="rb-dl-menu" class="btn ghost" type="button" data-rb="dl-menu" aria-haspopup="menu" title="Download as PDF, Word or LaTeX"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9m-4-4 4 4 4-4M4 15.5h12"/></svg><span>Download</span></button>
      <button id="rb-pdf" class="btn ghost" type="button" data-rb="dl-pdf" title="Download the PDF as TeX makes it"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9m-4-4 4 4 4-4M4 15.5h12"/></svg><span>PDF</span></button>
      <button id="rb-word" class="btn ghost" type="button" data-rb="dl-word" title="Download a Word file (.docx)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9m-4-4 4 4 4-4M4 15.5h12"/></svg><span>Word</span></button>
      <button id="b-save" class="btn ghost" type="button" data-rb="dl-tex" title="Download the LaTeX source (Ctrl+S)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9m-4-4 4 4 4-4M4 15.5h12"/></svg><span>LaTeX</span></button>
    </div>
    <input id="picinput" type="file" multiple hidden accept=".png,.jpg,.jpeg,.pdf,image/png,image/jpeg,application/pdf">
  </div>
  <div id="guest" class="guest-bar" hidden role="status"><span id="guest-msg"></span><button id="guest-send" class="btn sm" type="button">Send back</button><button id="guest-x" class="pop-x" type="button" aria-label="Hide">&times;</button></div>
  <main id="main">
    <aside id="nav" aria-label="Outline, problems, changes and git">
      <div id="nav-acts" class="nav-acts" role="group" aria-label="Actions"></div>
      <div class="nav-tabs" role="tablist">
        <button id="nt-outline" class="nav-tab on" type="button" role="tab" aria-selected="true">Outline</button>
        <button id="nt-problems" class="nav-tab" type="button" role="tab" aria-selected="false">Problems<span id="nt-count" class="nt-count"></span></button>
        <button id="nt-changes" class="nav-tab" type="button" role="tab" aria-selected="false" title="Comments, changes and versions">Review<span id="nt-ccount" class="nt-count"></span></button>
        <button id="nt-git" class="nav-tab" type="button" role="tab" aria-selected="false" title="Commits, branches, push and pull">Git<span id="nt-gcount" class="nt-count"></span></button>
        <span class="grow"></span>
        <button id="nav-close" class="pop-x" type="button" aria-label="Close">&times;</button>
      </div>
      <div id="nav-body" class="nav-body" role="tabpanel"></div>
    </aside>
    <section id="desk" aria-label="Typeset pages">
      <div id="sheet" class="sheet">
        <div id="pages" contenteditable="true" spellcheck="true" role="textbox" aria-multiline="true" aria-label="Document"></div>
        <div id="mhost" class="mhost" aria-hidden="true"><div id="mflow" class="flow"></div><div id="mfns" class="fns"></div></div>
        <div id="wlayer" class="wlayer"></div>
      </div>
      <div id="boot" class="boot">Typesetting&hellip;</div>
      <div class="dropzone">Drop .tex, .bib, images, a .zip or a Word .docx to open</div>
    </section>
    <div id="gutter" aria-hidden="true"></div>
    <aside id="srcpane" aria-label="LaTeX source">
      <div class="src-head"><div id="ftabs" class="ftabs"></div><button id="b-copy" class="btn ghost sm" type="button" title="Copy the .tex source to the clipboard"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="6.5" y="6.5" width="9" height="10" rx="1"/><path d="M4.5 13V4.5a1 1 0 0 1 1-1H12"/></svg><span>Copy source</span></button></div>
      <div id="cmhost"></div>
    </aside>
    <aside id="pdfpane" aria-label="PDF from TeX">
      <div class="pdf-bar">
        <span id="pdf-status" class="pdf-status" role="status">LaTeX</span>
        <span class="grow"></span>
        <select id="pdf-engine" class="pdf-engine" aria-label="TeX engine" title="Which TeX engine compiles this project">
          <option value="auto">Auto</option><option value="pdflatex">pdfLaTeX</option><option value="xelatex">XeLaTeX</option><option value="lualatex">LuaLaTeX</option><option value="latex">LaTeX (dvips)</option>
        </select>
        <label class="pdf-shell" title="Let packages run programs: minted (Pygments), gnuplot, EPS and PostScript (Ghostscript), makeindex. They run inside this page, never on your computer."><input id="pdf-shell" type="checkbox" checked> Shell escape</label>
        <button id="pdf-re" class="btn ghost sm" type="button" title="Compile again from scratch">Recompile</button>
        <button id="pdf-dl" class="btn ghost sm" type="button" title="Download the PDF" disabled>Download</button>
        <button id="pdf-x" class="pop-x" type="button" aria-label="Close the PDF">&times;</button>
      </div>
      <div id="pdf-prog" class="pdf-prog" hidden><span></span></div>
      <button id="pdf-msg" class="pdf-msg" type="button" hidden></button>
      <div id="pdf-host" class="pdf-host"></div>
    </aside>
  </main>
  <footer id="status">
    <span id="st-pages"></span><span id="st-words"></span><button id="st-warn" class="linkish" type="button" hidden></button>
    <span class="grow"></span>
    <!--APPSTATUS-->
    <span id="st-save">Kept in this browser</span>
    <button id="b-new" class="linkish" type="button">New document</button>
    <button id="b-sample" class="linkish" type="button">Load the sample</button>
  </footer>
  <div id="bubble" class="bubble" hidden>
    <button type="button" data-act="bf" title="Bold"><b>B</b></button>
    <button type="button" data-act="em" title="Emphasis"><i>I</i></button>
    <button type="button" data-act="tt" title="Typewriter" class="mono">tt</button>
    <button type="button" data-act="cm" title="Comment (Ctrl+Alt+M)">Comment</button>
    <button type="button" data-act="src" title="Show in source">&lt;/&gt;</button>
    <button type="button" data-act="ai" class="ai-only" title="Ask Claude">Ask Claude</button>
  </div>
  <aside id="ask" class="ask" hidden aria-label="Ask Claude">
    <div class="ask-h"><span>Ask Claude</span><button id="ask-close" class="pop-x" type="button" aria-label="Close">&times;</button></div>
    <div class="ask-lab">Selected LaTeX</div>
    <pre id="ask-frag" class="ask-frag"></pre>
    <div class="ask-presets">
      <button class="btn ghost sm" type="button" data-ask="Tighten this. Cut words that carry no information. Keep the meaning.">Tighten</button>
      <button class="btn ghost sm" type="button" data-ask="Fix grammar, spelling and LaTeX errors only. Change nothing else.">Fix errors</button>
      <button class="btn ghost sm" type="button" data-ask="Make this read like a top economics journal: precise, formal, plain.">More formal</button>
      <button class="btn ghost sm" type="button" data-ask="Rewrite so the argument is easier to follow on first read.">Clearer</button>
    </div>
    <div class="ask-in"><input id="ask-instr" type="text" placeholder="Or say what to change"><button id="ask-go" class="btn sm" type="button">Ask</button></div>
    <label class="ask-lab" for="ask-style">House style</label>
    <textarea id="ask-style" rows="2"></textarea>
    <textarea id="ask-out" class="code" rows="8" hidden></textarea>
    <div id="ask-actions" class="pop-row" hidden><button id="ask-discard" class="btn ghost sm" type="button">Discard</button><span class="grow"></span><button id="ask-accept" class="btn sm" type="button">Replace selection</button></div>
    <button id="ask-stop" class="btn ghost sm" type="button" hidden>Stop</button>
  </aside>
  <div id="toast" class="toast" role="status" hidden></div>
  <input id="fileinput" type="file" multiple hidden accept=".tex,.bib,.zip,.docx,.sty,.cls,.bst,.bbl,.png,.jpg,.jpeg,.gif,.svg,.webp,.pdf,.eps,.txt,.html,.htm">
</div>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js" integrity="sha384-cMkvdD8LoxVzGF/RPUKAcvmm49FQ0oxwDF3BGKtDXcEc+T1b2N+teh/OJfpU0jr6" crossorigin="anonymous"></script>
<script>/*APPJS*/</script>
