<title>Rikuy</title>
<style>/*FONTS*/</style>
<style>/*KATEX*/</style>
<style>/*CODEMIRROR*/</style>
<style>/*APP*/</style>
<div id="app">
  <header id="bar">
    <button id="b-nav" class="btn ghost icon" type="button" aria-pressed="false" title="Outline, problems and changes (Ctrl+Shift+O)" aria-label="Outline and problems"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 5.5h13M6.5 10h10M6.5 14.5h10"/></svg><span class="sr">Outline and problems</span><span id="nav-dot" class="nav-dot" aria-hidden="true" hidden></span></button>
    <div class="brand"><span class="mark">Rikuy</span><span id="docname" class="docname"></span></div>
    <div id="srch" class="srch"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5"/><path d="M12.2 12.2 16.5 16.5"/></svg><input id="rk-search" type="text" role="combobox" aria-label="Search" aria-autocomplete="list" aria-expanded="false" aria-controls="rk-search-list" autocomplete="off" spellcheck="false" placeholder="Search" title="Search for a command by its name (Alt+Q)"><div id="rk-search-list" class="srch-list" role="listbox" aria-label="Commands" hidden></div></div>
    <div class="tools">
      <button id="b-open" class="btn ghost" type="button" title="Open .tex, .bib, images, an Overleaf .zip or a Word .docx (Ctrl+O)" aria-label="Open"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5.5h5l1.5 1.5H17v8.5H3z"/></svg><span>Open</span></button>
      <button id="b-pdf" class="btn ghost" type="button" aria-pressed="false" title="Show the PDF as TeX makes it, beside the page (Ctrl+P)" aria-label="Preview"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 2.5h7l3.5 3.5v11.5H5zM12 2.5V6h3.5M7.5 10h5M7.5 13h5"/></svg><span>Preview</span></button>
      <button id="b-share" class="btn ghost" type="button" title="A link anyone can open and type in, or a copy for Overleaf" aria-label="Share"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="5" cy="10" r="2.2"/><circle cx="15" cy="5" r="2.2"/><circle cx="15" cy="15" r="2.2"/><path d="M7 9l6-3M7 11l6 3"/></svg><span>Share</span></button>
      <span class="sep"></span>
      <button id="b-undo" class="btn ghost icon" type="button" title="Undo (Ctrl+Z)" disabled aria-label="Undo"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5 3.5 8.5 7 12M4 8.5h8a4 4 0 0 1 0 8H9"/></svg><span class="sr">Undo</span></button>
      <button id="b-redo" class="btn ghost icon" type="button" title="Redo (Ctrl+Shift+Z)" disabled aria-label="Redo"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m13 5 3.5 3.5L13 12m3-3.5H8a4 4 0 0 0 0 8h3"/></svg><span class="sr">Redo</span></button>
      <span class="sep"></span>
      <div class="zoom" role="group" aria-label="Zoom">
        <button id="b-zout" class="btn ghost icon" type="button" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10"/></svg><span class="sr">Zoom out</span></button>
        <button id="zoomv" class="btn ghost zv" type="button" title="Fit width" aria-label="Fit width">Fit</button>
        <button id="b-zin" class="btn ghost icon" type="button" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10M10 5v10"/></svg><span class="sr">Zoom in</span></button>
      </div>
      <span class="sep"></span>
      <button id="b-ai" class="btn ghost ai-only" type="button" title="Ask Claude to rewrite the selection" aria-label="Ask Claude"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5v4M10 13.5v4M2.5 10h4M13.5 10h4M5 5l2.2 2.2M12.8 12.8 15 15M15 5l-2.2 2.2M7.2 12.8 5 15"/></svg><span>Ask Claude</span></button>
      <button id="b-src" class="btn ghost" type="button" aria-pressed="false" title="Show the source (Ctrl+\)" aria-label="Source"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m7 6-4 4 4 4m6-8 4 4-4 4"/></svg><span>Source</span></button>
      <button id="b-help" class="btn ghost icon" type="button" title="How it works" aria-label="Help"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M8 8a2 2 0 1 1 2.8 1.8c-.5.3-.8.7-.8 1.2v.5M10 14v.2"/></svg><span class="sr">Help</span></button>
    </div>
  </header>
  <div id="rb-top" class="rb-top">
    <div id="rb-tabs" class="rb-tabs" role="tablist" aria-label="Ribbon"></div>
    <span class="grow"></span>
    <button id="rb-collapse" class="rb-coll" type="button" aria-pressed="false" aria-label="Collapse the ribbon" title="Collapse the ribbon to its tabs (Ctrl+F1)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 12.5l4-4 4 4"/></svg></button>
  </div>
  <div id="ribbon" class="rb">
    <select id="rb-tabsel" class="rb-tabsel" aria-label="Ribbon tab" title="Which of the ribbon's tabs shows"></select>
    <div id="rb-gw" class="rb-gw">
      <div id="rb-gallery" class="rb-gal" role="group" aria-label="Styles">
        <button id="rb-st-up" class="rb-sb rb-pg" type="button" data-cmd="styles-prev" aria-label="Previous styles" title="Previous styles"><svg viewBox="0 0 8 12" aria-hidden="true"><path d="M5.5 2 1.5 6l4 4"/></svg></button>
        <div class="rb-tiles">
          <button id="rb-st-p" class="rb-tile st-p" type="button" data-style="p" aria-pressed="false" aria-label="Normal" data-tip="Normal: a paragraph of text (Ctrl+Alt+0)"><span aria-hidden="true">Normal</span></button>
          <button id="rb-st-title" class="rb-tile st-title" type="button" data-style="title" aria-pressed="false" aria-label="Title" data-tip="Title: the document's title, from \title" hidden><span aria-hidden="true">Title</span></button>
          <button id="rb-st-section" class="rb-tile st-section" type="button" data-style="section" aria-pressed="false" aria-label="Heading 1" data-tip="Heading 1: a section (Ctrl+Alt+1)"><span aria-hidden="true">Heading 1</span></button>
          <button id="rb-st-subsection" class="rb-tile st-subsection" type="button" data-style="subsection" aria-pressed="false" aria-label="Heading 2" data-tip="Heading 2: a subsection (Ctrl+Alt+2)"><span aria-hidden="true">Heading 2</span></button>
          <button id="rb-st-subsubsection" class="rb-tile st-subsubsection" type="button" data-style="subsubsection" aria-pressed="false" aria-label="Heading 3" data-tip="Heading 3: a subsubsection (Ctrl+Alt+3)"><span aria-hidden="true">Heading 3</span></button>
          <button id="rb-st-latex" class="rb-tile st-latex" type="button" data-style="latex" aria-pressed="false" aria-label="LaTeX source" data-tip="LaTeX source: shows the paragraph as LaTeX that you type directly, and puts the line % rikuy: latex before it in the file (TeX ignores it)"><span class="tex-logo" aria-hidden="true">L<span class="tl-a">a</span>T<span class="tl-e">e</span>X</span></button>
          <button id="rb-st-quote" class="rb-tile st-quote" type="button" data-style="quote" aria-pressed="false" aria-label="Quote" data-tip="Quote: the paragraph set in from both sides"><span aria-hidden="true">Quote</span></button>
        </div>
        <button id="rb-st-down" class="rb-sb rb-pg" type="button" data-cmd="styles-next" aria-label="Next styles" title="Next styles"><svg viewBox="0 0 8 12" aria-hidden="true"><path d="M2.5 2l4 4-4 4"/></svg></button>
        <button id="rb-st-more" class="rb-sb rb-more" type="button" data-cmd="styles-more" aria-haspopup="menu" aria-expanded="false" aria-label="More styles" title="All the styles"><svg viewBox="0 0 10 8" aria-hidden="true"><path d="M1.5 1.2h7M1.5 3.7 5 7.2l3.5-3.5"/></svg></button>
      </div>
      <span class="rb-cap" aria-hidden="true">Styles</span>
    </div>
    <select id="rb-style" class="rb-style" aria-label="Style of this paragraph" title="Style of the paragraph the caret is in">
      <option value="p">Normal text</option><option value="title">Title</option><option value="section">Heading 1</option><option value="subsection">Heading 2</option><option value="subsubsection">Heading 3</option><option value="latex">LaTeX</option><option value="quote">Quote</option>
    </select>
    <div class="rb-dl" role="group" aria-label="Download">
      <span class="rb-lab">Download</span>
      <button id="rb-dl-menu" class="btn ghost" type="button" data-cmd="download-menu" aria-haspopup="menu" title="Download as PDF, Word or LaTeX" aria-label="Download"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9m-4-4 4 4 4-4M4 15.5h12"/></svg><span>Download</span></button>
      <button id="rb-pdf" class="btn ghost" type="button" data-cmd="download-pdf" title="Download the PDF as TeX makes it" aria-label="Download PDF"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9m-4-4 4 4 4-4M4 15.5h12"/></svg><span>PDF</span></button>
      <button id="rb-word" class="btn ghost" type="button" data-cmd="download-word" title="Download a Word file (.docx)" aria-label="Download Word"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9m-4-4 4 4 4-4M4 15.5h12"/></svg><span>Word</span></button>
      <button id="b-save" class="btn ghost" type="button" data-cmd="download-latex" title="Download the LaTeX source (Ctrl+S)" aria-label="Download LaTeX"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9m-4-4 4 4 4-4M4 15.5h12"/></svg><span>LaTeX</span></button>
    </div>
    <input id="picinput" type="file" multiple hidden accept=".png,.jpg,.jpeg,.pdf,image/png,image/jpeg,application/pdf">
  </div>
  <div id="guest" class="guest-bar" hidden role="status"><span id="guest-msg"></span><button id="guest-send" class="btn sm" type="button" aria-label="Send back">Send back</button><button id="guest-x" class="pop-x" type="button" aria-label="Hide">&times;</button></div>
  <div id="script-note" class="guest-bar note-bar" hidden role="status"><span id="script-msg"></span><button id="script-go" class="btn sm" type="button" aria-label="Set it up">Set it up</button><button id="script-x" class="pop-x" type="button" aria-label="Not now" title="Not now">&times;</button></div>
  <main id="main">
    <aside id="nav" aria-label="Outline, problems, changes and git">
      <div id="nav-acts" class="nav-acts" role="menu" aria-label="Actions"></div>
      <div class="nav-tabs" role="tablist" aria-label="Panel">
        <button id="nt-outline" class="nav-tab on" type="button" role="tab" aria-selected="true" aria-label="Outline">Outline</button>
        <button id="nt-problems" class="nav-tab" type="button" role="tab" aria-selected="false" aria-label="Problems" aria-describedby="nt-count">Problems<span id="nt-count" class="nt-count"></span></button>
        <button id="nt-changes" class="nav-tab" type="button" role="tab" aria-selected="false" title="Comments, changes and versions" aria-label="Review" aria-describedby="nt-ccount">Review<span id="nt-ccount" class="nt-count"></span></button>
        <button id="nt-git" class="nav-tab" type="button" role="tab" aria-selected="false" title="Commits, branches, push and pull" aria-label="Git" aria-describedby="nt-gcount">Git<span id="nt-gcount" class="nt-count"></span></button>
        <span class="grow"></span>
        <button id="nav-close" class="pop-x" type="button" aria-label="Close the panel">&times;</button>
      </div>
      <div id="nav-body" class="nav-body" role="tabpanel" aria-labelledby="nt-outline"></div>
    </aside>
    <section id="desk" aria-label="Typeset pages">
      <span id="pages-how" class="sr">The typeset page. Click a paragraph and type; edits change the LaTeX source.</span>
      <div id="sheet" class="sheet">
        <div id="pages" contenteditable="true" spellcheck="true" role="textbox" aria-multiline="true" aria-label="Document" aria-describedby="pages-how"></div>
        <div id="mhost" class="mhost" aria-hidden="true"><div id="mflow" class="flow"></div><div id="mfns" class="fns"></div></div>
        <div id="wlayer" class="wlayer"></div>
      </div>
      <div id="boot" class="boot">Typesetting&hellip;</div>
      <div class="dropzone">Drop .tex, .bib, images, a .zip or a Word .docx to open</div>
    </section>
    <div id="gutter" aria-hidden="true"></div>
    <aside id="srcpane" aria-label="LaTeX source">
      <div class="src-head"><div id="ftabs" class="ftabs"></div><button id="b-copy" class="btn ghost sm" type="button" title="Copy the .tex source to the clipboard" aria-label="Copy source"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="6.5" y="6.5" width="9" height="10" rx="1"/><path d="M4.5 13V4.5a1 1 0 0 1 1-1H12"/></svg><span>Copy source</span></button></div>
      <div id="cmhost"></div>
    </aside>
    <aside id="pdfpane" aria-label="PDF from TeX">
      <div class="pdf-bar">
        <span id="pdf-status" class="pdf-status">LaTeX</span>
        <span class="grow"></span>
        <select id="pdf-engine" class="pdf-engine" aria-label="TeX engine" title="Which TeX engine compiles this project">
          <option value="auto">Auto</option><option value="pdflatex">pdfLaTeX</option><option value="xelatex">XeLaTeX</option><option value="lualatex">LuaLaTeX</option><option value="latex">LaTeX (dvips)</option>
        </select>
        <label class="pdf-shell" title="Let packages run programs: minted (Pygments), gnuplot, EPS and PostScript (Ghostscript), makeindex. They run inside this page, never on your computer."><input id="pdf-shell" type="checkbox" aria-label="Shell escape" checked> Shell escape</label>
        <button id="pdf-re" class="btn ghost sm" type="button" title="Compile again from scratch">Recompile</button>
        <button id="pdf-dl" class="btn ghost sm" type="button" title="Download the PDF" disabled aria-label="Download this PDF">Download</button>
        <button id="pdf-x" class="pop-x" type="button" aria-label="Close the PDF">&times;</button>
      </div>
      <div id="pdf-prog" class="pdf-prog" aria-hidden="true" hidden><span></span></div>
      <button id="pdf-msg" class="pdf-msg" type="button" hidden></button>
      <div id="pdf-host" class="pdf-host"></div>
    </aside>
  </main>
  <footer id="status">
    <button id="st-pages" class="linkish" type="button" title="Go To a page, a heading, a footnote, an equation or a label (Ctrl+G)"></button><span id="st-words"></span><button id="st-warn" class="linkish" type="button" hidden></button>
    <span class="grow"></span>
    <!--APPSTATUS-->
    <span id="st-save">Kept in this browser</span>
    <button id="b-new" class="linkish" type="button" aria-label="New document">New document</button>
    <button id="b-sample" class="linkish" type="button" aria-label="Load the sample">Load the sample</button>
  </footer>
  <div id="bubble" class="bubble" role="toolbar" aria-label="Selection" hidden>
    <button type="button" data-act="bf" aria-label="Bold selection" title="Bold"><b aria-hidden="true">B</b></button>
    <button type="button" data-act="em" aria-label="Emphasize selection" title="Emphasis"><i aria-hidden="true">I</i></button>
    <button type="button" data-act="tt" aria-label="Typewriter selection" title="Typewriter" class="mono">tt</button>
    <button type="button" data-act="cm" aria-label="Comment on selection" title="Comment (Ctrl+Alt+M)">Comment</button>
    <button type="button" data-act="src" aria-label="Show selection in source" title="Show in source">&lt;/&gt;</button>
    <button type="button" data-act="ai" class="ai-only" aria-label="Ask Claude about selection" title="Ask Claude">Ask Claude</button>
  </div>
  <aside id="ask" class="ask" hidden aria-label="Ask Claude">
    <div class="ask-h"><span>Ask Claude</span><button id="ask-close" class="pop-x" type="button" aria-label="Close Ask Claude">&times;</button></div>
    <div class="ask-lab">Selected LaTeX</div>
    <pre id="ask-frag" class="ask-frag"></pre>
    <div class="ask-presets">
      <button class="btn ghost sm" type="button" data-ask="Tighten this. Cut words that carry no information. Keep the meaning.">Tighten</button>
      <button class="btn ghost sm" type="button" data-ask="Fix grammar, spelling and LaTeX errors only. Change nothing else.">Fix errors</button>
      <button class="btn ghost sm" type="button" data-ask="Make this read like a top economics journal: precise, formal, plain.">More formal</button>
      <button class="btn ghost sm" type="button" data-ask="Rewrite so the argument is easier to follow on first read.">Clearer</button>
    </div>
    <div class="ask-in"><input id="ask-instr" type="text" placeholder="Or say what to change" aria-label="What to change"><button id="ask-go" class="btn sm" type="button" aria-label="Ask">Ask</button></div>
    <label class="ask-lab" for="ask-style">House style</label>
    <textarea id="ask-style" rows="2"></textarea>
    <textarea id="ask-out" class="code" rows="8" aria-label="The rewrite, as LaTeX" hidden></textarea>
    <div id="ask-actions" class="pop-row" hidden><button id="ask-discard" class="btn ghost sm" type="button" aria-label="Discard">Discard</button><span class="grow"></span><button id="ask-accept" class="btn sm" type="button" aria-label="Replace selection">Replace selection</button></div>
    <button id="ask-stop" class="btn ghost sm" type="button" hidden aria-label="Stop">Stop</button>
  </aside>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="pdf-live" class="sr" role="status" aria-live="polite" aria-label="PDF status"></div>
  <input id="fileinput" type="file" multiple hidden accept=".tex,.bib,.zip,.docx,.sty,.cls,.bst,.bbl,.png,.jpg,.jpeg,.gif,.svg,.webp,.pdf,.eps,.txt,.html,.htm">
</div>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js" integrity="sha384-cMkvdD8LoxVzGF/RPUKAcvmm49FQ0oxwDF3BGKtDXcEc+T1b2N+teh/OJfpU0jr6" crossorigin="anonymous"></script>
<script>/*APPJS*/</script>
